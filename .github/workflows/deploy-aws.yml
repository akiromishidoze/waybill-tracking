name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Terraform Deploy (AWS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: infrastructure/terraform/aws
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_AWS }}" \
            -backend-config="key=terraform/aws/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE_AWS }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: infrastructure/terraform/aws
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform/aws
        run: |
          terraform plan \
            -var="region=${{ env.AWS_REGION }}" \
            -var="ecr_repository_url=${{ secrets.ECR_REPOSITORY_URL }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="vpc_id=${{ secrets.AWS_VPC_ID }}" \
            -var="subnet_ids=${{ secrets.AWS_SUBNET_IDS }}" \
            -var="public_subnet_ids=${{ secrets.AWS_PUBLIC_SUBNET_IDS }}" \
            -var="private_subnet_ids=${{ secrets.AWS_PRIVATE_SUBNET_IDS }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="admin_email=${{ secrets.ADMIN_EMAIL }}" \
            -var="admin_password=${{ secrets.ADMIN_PASSWORD }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/terraform/aws
        run: terraform apply -auto-approve tfplan
